<!doctype html>
<html>
<head>
  <title>JavaScript demo</title>
  <style>
    html { background: #e9f2ff; }
    body { max-width: 32em; margin: auto; padding: 12vh 2em 2em; text-align: center; }
  </style>
</head>
<body>
  <h1>MX browser JavaScript</h1>
  <p id="status">Script has not run</p>
  <script>
    let word = 'JavaScript';
    document.getElementById('status').textContent = word + ' works here';
    document.write('<p>Generated by document.write()</p>');
    document.title = 'JavaScript active';
  </script>
</body>
</html>
